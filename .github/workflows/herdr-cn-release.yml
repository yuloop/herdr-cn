name: Herdr Chinese Release
on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17，避开备份/其他流水线
  workflow_dispatch:
concurrency:
  group: herdr-cn-release
  cancel-in-progress: false
permissions:
  contents: write
env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: "true"
jobs:
  slot-guard:
    name: 同槽位已有更早的 run 则取消本次
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: 取消重复的定时运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: herdr-cn-release.yml
          SLOT_MIN: "17"
          SLOT_HOURS: "3"
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "非定时触发（$EVENT_NAME），放行"
            exit 0
          fi
          now=$(date -u +%s)
          slot=0
          for h in $SLOT_HOURS; do
            for d in today yesterday; do
              c=$(date -u -d "$d $h:$SLOT_MIN" +%s 2>/dev/null || true)
              if [ -n "$c" ] && [ "$c" -le "$now" ] && [ "$c" -gt "$slot" ]; then slot=$c; fi
            done
          done
          if [ "$slot" -eq 0 ]; then echo "算不出槽位，放行"; exit 0; fi
          earlier=0
          while read -r id ts; do
            [ -z "$id" ] && continue
            [ "$id" = "$RUN_ID" ] && continue
            c=$(date -u -d "$ts" +%s 2>/dev/null || echo 0)
            if [ "$c" -ge "$slot" ]; then earlier=$((earlier+1)); fi
          done <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_FILE/runs?per_page=50" --jq '.workflow_runs[] | "\(.id) \(.created_at)"')"
          echo "槽位起点=$slot 同槽更早 run=$earlier"
          if [ "$earlier" -gt 0 ]; then
            echo "本槽位已有更早的 run，取消这次重复运行"
            gh run cancel "$RUN_ID" -R "$GITHUB_REPOSITORY" || true
          fi
  resolve:
    needs: slot-guard
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.res.outputs.should_build }}
      tag: ${{ steps.res.outputs.tag }}
      ver: ${{ steps.res.outputs.ver }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve upstream version
        id: res
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/herdrdev/herdr.git" || true
          git fetch --tags upstream master
          UP_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "upstream latest tag: ${UP_TAG:-none}"
          if [ -z "$UP_TAG" ]; then echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          VER="${UP_TAG#v}"
          # 汉化版 tag：v<ver>-cn
          CN_TAG="v${VER}-cn"
          # workflow_dispatch = 手动强制构建（跳过检查，直接构建并发布）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：强制构建 ${CN_TAG}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${CN_TAG}" >> "$GITHUB_OUTPUT"
            echo "ver=${VER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 已发过且上游没更新 → 跳过（防止每天重复构建覆盖）
          if git rev-parse -q --verify "refs/tags/${CN_TAG}" >/dev/null 2>&1; then
            echo "汉化 tag ${CN_TAG} 已存在，检查上游是否更新"
            CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "${VER}" = "${CARGO_VER}" ]; then
              echo "上游无新版本，跳过"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=${CN_TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: herdr-cn-${{ needs.resolve.outputs.ver }}-linux-x64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-cn-${{ needs.resolve.outputs.ver }}-windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install Zig
        # build.rs 的 vendored libghostty-vt 在 Linux/Windows 都需要 zig（上游同款逻辑）
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake ninja -y --no-progress
          }
      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo build --release --locked --bin herdr --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/herdr* | head -5
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/herdr dist/herdr
          tar -czf dist/${{ matrix.name }}.tar.gz -C dist herdr
          sha256sum dist/${{ matrix.name }}.tar.gz
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\herdr.exe" dist\herdr.exe
          Compress-Archive -Path dist\herdr.exe -DestinationPath "dist\${{ matrix.name }}.zip" -Force
          Get-FileHash "dist\${{ matrix.name }}.zip" -Algorithm SHA256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum herdr-cn-*.tar.gz herdr-cn-*.zip > SHA256SUMS
          ls -la
      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: herdr 汉化版 ${{ needs.resolve.outputs.tag }}
          body: |
            herdr 汉化版 ${{ needs.resolve.outputs.tag }}（基于上游 v${{ needs.resolve.outputs.ver }}）

            - Linux x64 / Windows x64 双平台预编译
            - 安装：`herdr cn-install` 或下载对应压缩包解压
          files: dist/*.tar.gz,dist/*.zip,dist/SHA256SUMS
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true